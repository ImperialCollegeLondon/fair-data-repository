name: CI
on:
  pull_request:
    branches:
      - main
      - develop
      - staging
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: setup project dependencies
        run: uvx invenio-cli==1.12 install python
      - name: setup symlink
        run: uvx invenio-cli==1.12 install symlink
      - name: run tests
        run: uv run pytest -p no:warnings -m "not e2e"
  check_assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - uses: pnpm/setup@v2
        with:
          version: 11
      - name: install dependencies and build assets
        run: uvx invenio-cli==1.12 install
