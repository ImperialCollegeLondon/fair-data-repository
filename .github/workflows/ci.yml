name: CI
on:
  pull_request:
    branches:
      - main
      - develop
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: pre-commit/action@v2.0.3
  test:
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - name: decider
        uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            doc:
              - "docs/**"
              - "app_data/**"
              - "docker/**"
      - uses: actions/checkout@v4
        if: steps.paths.outputs.doc == 'false'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pipenv"
        if: steps.paths.outputs.doc == 'false'
      - name: install pipenv and invenio-cli
        if: steps.paths.outputs.doc == 'false'
        run: pip install pipenv invenio-cli
      - name: setup project dependencies
        if: steps.paths.outputs.doc == 'false'
        run: invenio-cli install python
      - name: setup symlink
        if: steps.paths.outputs.doc == 'false'
        run: invenio-cli install symlink
      - name: run tests
        if: steps.paths.outputs.doc == 'false'
        run: pipenv run pytest
