name: End-to-End Tests

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - develop
      - staging
      - e2e-submission-review-decline

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        if: ${{ github.event.repository.private }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install CLI tooling
        run: |
          python -m pip install --upgrade pip pipx
          pipx install pipenv
          pipx install invenio-cli

      - name: Install project
        run: pipenv run invenio-cli install

      - name: Start services
        run: pipenv run invenio-cli services setup --no-demo-data


      - name: Start dev server
        run: |
          pipenv run invenio-cli run > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for app to be ready
        run: |
          for i in {1..90}; do
            if curl -sSkf https://localhost:5000/ > /dev/null; then
              exit 0;
            fi
            sleep 3;
          done
          echo "App did not start in time" >&2
          tail -n 200 app.log || true
          exit 1

      - name: Set up e2e submission access
        run: |
          pipenv run python app_data/create_imperial_community.py
          pipenv run invenio users create test.user@test.co --password password --active --confirm
          pipenv run invenio access allow deposit-action user test.user@test.co
          pipenv run invenio users create test.superuser@test.co --password password --active --confirm
          pipenv run invenio access allow superuser-access user test.superuser@test.co

      - name: Run Selenium e2e
        env:
          MOZ_HEADLESS: 1
        run: pipenv run pytest -m e2e tests/e2e

      - name: Upload app logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: invenio-cli-app-log
          path: |
            app.log
            artifacts/**/*.png
            artifacts/**/*.html

      - name: Upload e2e screenshots
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: artifacts/**/*.png
