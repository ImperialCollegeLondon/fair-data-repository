name: Build and Publish

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      image_tag_with_sha: ${{ steps.export-data.outputs.image_tag_with_sha }}
    steps:
      - uses: actions/checkout@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get image metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{steps.meta.outputs.tags }}
      - name: Export data for deployment
        id: export-data
        run: |
          echo "image_tag_with_sha=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - name: Scan backend Docker image with Trivy
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: "table"
          exit-code: 0 # Do not fail the build on vulnerabilities
          output: trivy-backend.txt
      - name: Upload Trivy backend scan report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-report
          path: trivy-backend.txt
  deploy:
    needs: build-and-publish
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag_with_sha: ghcr.io/imperialcollegelondon/fair-data-repository@${{needs.build-and-publish.outputs.image_tag_with_sha}}
      environment_name: ${{ github.ref_name }}
    secrets: inherit
