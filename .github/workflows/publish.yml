name: Build and Publish

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      image_tag_with_sha: ${{ steps.export-data.outputs.image_tag_with_sha }}
    steps:
      - uses: actions/checkout@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get image metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{steps.meta.outputs.tags }}
      - name: Get image frontend metadata
        id: frontend-meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=frontend-${{ github.ref_name }}
      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./docker/nginx
          push: true
          tags: ${{steps.frontend-meta.outputs.tags }}
      - name: Export data for deployment
        id: export-data
        run: |
          echo "image_tag_with_sha=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
  deploy:
    needs: build-and-publish
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag_with_sha: ${{needs.build-and-publish.outputs.image_tag_with_sha}}
      environment_name: ${{ github.ref_name }}
    secrets: inherit
