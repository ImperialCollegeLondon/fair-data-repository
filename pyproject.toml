[project]
name = "ic-data-repo-app"
version = "1.0.0"
authors = [{name = "Imperial College London", email = "info@invenio.rcs.ic.ac.uk"}]
license = "MIT"
requires-python = "~=3.12.0"
dependencies = [
    "invenio-app-rdm[opensearch2]~=13.0.0",
    "ic-data-repo",
    "lxml",
    "msgraph-sdk",
    "pyuwsgi>=2.0",
    "sqlalchemy-continuum!=1.4.0",
    "types-lxml",
    "types-requests",
    "uwsgi-tools>=1.1.1",
    "uwsgitop>=0.11",
    "setuptools<=81",
]

[dependency-groups]
dev = [
    "mkdocs",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-material",
    "mkdocs-section-index",
    "mkdocstrings-python",
    "pika",
    "pre-commit",
    "pytest-invenio>=4.0.0,<5.0.0",
    "pytest-invenio>=4.0.0,<5.0.0",
    "pytest-mypy",
    "pytest<8",
    "selenium",
    "testcontainers",
    "urllib3>=2.6.0",
    "webdriver-manager",
]

[tool.uv.sources]
ic-data-repo = {workspace = true}

[tool.uv.workspace]
members = ["site"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]
required-plugins = ["flake8-docstring"]
docstring-convention = "google"

[tool.isort]
line_length = 88
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
disallow_any_generics = true
warn_unreachable = true
warn_unused_ignores = true
exclude = "test_data/.*\\.py"

[[tool.mypy.overrides]]
module = [
       "celery.*",
       "flask_login.*",
       "flask_oauthlib.*",
       "flask_principal.*",
       "ic_data_repo.config.*",
       "ic_data_repo.permissions.*",
       "invenio_access.*",
       "invenio_accounts.*",
       "invenio_app.*",
       "invenio_app_rdm.config.*",
       "invenio_assets.*",
       "invenio_communities.*",
       "invenio_db.*",
       "invenio_i18n.*",
       "invenio_notifications.*",
       "invenio_oauth2server.*",
       "invenio_oauthclient.*",
       "invenio_records_permissions.*",
       "invenio_records_resources.*",
       "invenio_rdm_records.*",
       "invenio_vocabularies.*",
       "marshmallow.*",
       "marshmallow_utils.*",
       "testcontainers.*",
       "flask_resources.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--mypy --ignore=site/setup.py --ignore-glob=test_data/*.py -m 'not e2e'"
markers = [
    "e2e: End-to-end UI tests",
]
