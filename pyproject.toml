[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]
required-plugins = ["flake8-docstring"]
docstring-convention = "google"

[tool.isort]
line_length = 88
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
disallow_any_generics = true
warn_unreachable = true
warn_unused_ignores = true
exclude = "test_data/.*\\.py"

[[tool.mypy.overrides]]
module = [
       "celery.*",
       "flask_login.*",
       "flask_oauthlib.*",
       "flask_principal.*",
       "ic_data_repo.config.*",
       "ic_data_repo.permissions.*",
       "invenio_access.*",
       "invenio_accounts.*",
       "invenio_app.*",
       "invenio_app_rdm.config.*",
       "invenio_assets.*",
       "invenio_communities.*",
       "invenio_db.*",
       "invenio_i18n.*",
       "invenio_notifications.*",
       "invenio_oauthclient.*",
       "invenio_records_permissions.*",
       "invenio_records_resources.*",
       "invenio_rdm_records.*",
       "invenio_vocabularies.*",
       "marshmallow.*",
       "marshmallow_utils.*",
       "testcontainers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--mypy --ignore=site/setup.py --ignore-glob=test_data/*.py"
